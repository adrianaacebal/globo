<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title> GLOBO - Order online </title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <script src="exercises.js" defer></script>
</head>

<body>

    <input type="checkbox" id="menu-toggle" class="menu-toggle" checked>

    <header>
        <img class="logo-img" src="images/image.png" alt="Globo logo" width="59" height="60">

          <p class="logo">
            <span class="l1">G</span><span class="l2">L</span><span class="l3">O</span><span class="l4">B</span><span class="l5">O</span>
        </p>
        <label class="menu-btn" for="menu-toggle">☰</label>

    </header>

 <div class="layout">
        <nav class="sidebar">
            <p class="sidebar-title">Menu</p>
            <ul>
                <li><a href="index.html"><span class="nav-icon">🏠</span>Home</a></li>
                <li><a href="login.html"><span class="nav-icon">👤</span>Login</a></li>
                <li><a href="order.html"><span class="nav-icon">✉️</span>Order online</a></li>
                <li><a href="search.html"><span class="nav-icon">📍</span>Search for restaurants</a></li>
                <li><a href="complaint.html"><span class="nav-icon">⚠️</span>Report a problem</a></li>
            </ul>
        </nav>

    <main>
     <section>
        <h1>Order Online</h1>

        <form id="order-form" class="complaint-box">
            <label for="user-name">Name</label>
            <input type="text" id="user-name" name="name" required>

            <label for="user-email">Email</label>
            <input type="email" id="user-email" name="email" autocomplete="email" required>

            <label for="order-type">Type of order</label>
            <select id="order-type" name="type" required>
                <option value="">Select a type</option>
                <option value="delivery">Delivery</option>
                <option value="pickup">Pick up</option>
            </select>

            <label for="restaurant-name">Name of the restaurant</label>
            <input type="text" id="restaurant-name" name="restaurant" required>
            
            <label for="restaurant-location">Location of the restaurant</label>
            <input type="text" id="restaurant-location" name="location" required>

            <label for ="current-location">Current location</label>
            <input type="text" id="current-location" name="location" required>

            <button type="submit">Send order</button>
        </form>

        <!-- Mensaje de exito. Se ve cuando se ha enviado el pedido -->
        <div id="order-success" class="complaint-box" hidden>
            <p>Your order has been sent successfully! 🎉</p>
            <button type="button" id="new-order-btn">Make another order</button>
        </div>
     </section>
    </main>

    </div>

    <footer>
        <p>Made by: Maria Cuadrado and Adriana Acebal</p>
        <p>&copy; 2026 GLOBO. All rights reserved.</p>
        <p><a href="index.html">Back to homepage</a> · <a href="contact.html">Contact us</a> ·
           <a href="https://www.instagram.com/" title="Opens Instagram, an external website">Follow us on Instagram</a></p>
    </footer>

<script>
    // No hay servidor: al enviar, se oculta el formulario y se ensena
    // el mensaje de exito en vez de recargar la pagina.
    var orderForm = document.getElementById("order-form");
    var success = document.getElementById("order-success");

    orderForm.addEventListener("submit", function (event) {
        event.preventDefault();
        orderForm.reset();
        orderForm.hidden = true;
        success.hidden = false;
    });

    // Volver a ensenar el formulario para hacer otro pedido
    document.getElementById("new-order-btn").addEventListener("click", function () {
        success.hidden = true;
        orderForm.hidden = false;
    });
</script>
</body>
</html>
