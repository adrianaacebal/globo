$kind: http-request
name: create restaurant
method: POST
url: '{{baseUrl}}/restaurants'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Telepizza Sol",
      "brand": "telepizza",
      "area": "Centro",
      "type": "pizza",
      "delivery": true,
      "lat": 40.4169,
      "lon": -3.7035
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      const r = pm.response.json();
      pm.test("Has id", () => pm.expect(r.id).to.be.a("number"));
      pm.collectionVariables.set("restaurantId", r.id);
