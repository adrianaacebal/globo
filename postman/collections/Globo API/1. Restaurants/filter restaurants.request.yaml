$kind: http-request
name: 'filter restaurants (area + type)'
method: GET
url: '{{baseUrl}}/restaurants?area=Centro&type=pizza'
order: 2000
queryParams:
  - key: area
    value: Centro
  - key: type
    value: pizza
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Only Centro pizzas", () => pm.response.json().forEach(r => {
        pm.expect(r.area).to.eql("Centro");
        pm.expect(r.type).to.eql("pizza");
      }));
