$kind: http-request
name: get restaurant by id
method: GET
url: '{{baseUrl}}/restaurants/{{restaurantId}}'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Same id", () => pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get("restaurantId"))));
