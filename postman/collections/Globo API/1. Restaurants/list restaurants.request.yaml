$kind: http-request
method: GET
url: '{{baseUrl}}/restaurants'
order: 1000
queryParams:
  - key: search
    value: ''
    disabled: true
  - key: brand
    value: burgerking
    disabled: true
  - key: area
    value: Centro
    disabled: true
  - key: type
    value: burger
    disabled: true
  - key: delivery
    value: 'true'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response is an array", () => pm.expect(pm.response.json()).to.be.an("array"));
