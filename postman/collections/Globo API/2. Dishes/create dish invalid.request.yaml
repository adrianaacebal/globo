$kind: http-request
name: 'create dish invalid -> 400'
method: POST
url: '{{baseUrl}}/dishes'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "",
      "brand": "unknown",
      "category": "snack",
      "price": -1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("Has errors", () => pm.expect(pm.response.json().errors).to.be.an("array").that.is.not.empty);
