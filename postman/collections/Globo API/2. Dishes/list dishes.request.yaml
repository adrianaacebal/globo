$kind: http-request
name: list dishes
method: GET
url: '{{baseUrl}}/dishes'
order: 1000
queryParams:
  - key: search
    value: ''
    disabled: true
  - key: brand
    value: burgerking
    disabled: true
  - key: category
    value: main
    disabled: true
  - key: minPrice
    value: '5'
    disabled: true
  - key: maxPrice
    value: '15'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response is an array", () => pm.expect(pm.response.json()).to.be.an("array"));
