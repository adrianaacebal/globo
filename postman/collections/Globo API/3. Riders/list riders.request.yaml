$kind: http-request
name: list riders
method: GET
url: '{{baseUrl}}/riders'
order: 1000
queryParams:
  - key: search
    value: ''
    disabled: true
  - key: vehicle
    value: motorbike
    disabled: true
  - key: area
    value: Centro
    disabled: true
  - key: available
    value: 'true'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response is an array", () => pm.expect(pm.response.json()).to.be.an("array"));
