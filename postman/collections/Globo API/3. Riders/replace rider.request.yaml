$kind: http-request
name: 'replace rider (PUT)'
method: PUT
url: '{{baseUrl}}/riders/{{riderId}}'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Carlos López Martínez",
      "vehicle": "motorbike",
      "area": "Retiro",
      "available": true,
      "rating": 4.8
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Name updated", () => pm.expect(pm.response.json().name).to.eql("Carlos López Martínez"));
