$kind: http-request
name: 'update rider (PATCH)'
method: PATCH
url: '{{baseUrl}}/riders/{{riderId}}'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "available": false
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Available updated", () => pm.expect(pm.response.json().available).to.eql(false));
