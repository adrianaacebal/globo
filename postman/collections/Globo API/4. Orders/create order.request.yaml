$kind: http-request
name: create order
method: POST
url: '{{baseUrl}}/orders'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "customer": "Ana García",
      "restaurantId": {{restaurantId}},
      "riderId": {{riderId}},
      "type": "delivery",
      "status": "pending",
      "total": 15.50,
      "paid": false
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      const r = pm.response.json();
      pm.test("Has id", () => pm.expect(r.id).to.be.a("number"));
      pm.collectionVariables.set("orderId", r.id);
