$kind: http-request
name: 'create review invalid -> 400'
method: POST
url: '{{baseUrl}}/reviews'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "author": "",
      "rating": 10,
      "restaurantId": "abc"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("Has errors", () => pm.expect(pm.response.json().errors).to.be.an("array").that.is.not.empty);
