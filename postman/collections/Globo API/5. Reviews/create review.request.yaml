$kind: http-request
name: create review
method: POST
url: '{{baseUrl}}/reviews'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "restaurantId": 1,
      "author": "Ana García",
      "rating": 4,
      "comment": "Very good food and fast delivery!",
      "verified": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      const r = pm.response.json();
      pm.test("Has id", () => pm.expect(r.id).to.be.a("number"));
      pm.collectionVariables.set("reviewId", r.id);
