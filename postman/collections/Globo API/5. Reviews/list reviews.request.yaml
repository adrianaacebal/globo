$kind: http-request
name: list reviews
method: GET
url: '{{baseUrl}}/reviews'
order: 1000
queryParams:
  - key: search
    value: ''
    disabled: true
  - key: restaurantId
    value: '1'
    disabled: true
  - key: rating
    value: '4'
    disabled: true
  - key: verified
    value: 'true'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response is an array", () => pm.expect(pm.response.json()).to.be.an("array"));
