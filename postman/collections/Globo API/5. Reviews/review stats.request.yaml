$kind: http-request
name: review stats
method: GET
url: '{{baseUrl}}/reviews/stats'
order: 2000
queryParams:
  - key: search
    value: ''
    disabled: true
  - key: restaurantId
    value: '1'
    disabled: true
  - key: rating
    value: '4'
    disabled: true
  - key: verified
    value: 'true'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Has total", () => pm.expect(pm.response.json().total).to.be.a("number"));
