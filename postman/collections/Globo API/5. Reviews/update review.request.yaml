$kind: http-request
name: 'update review (PATCH)'
method: PATCH
url: '{{baseUrl}}/reviews/{{reviewId}}'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "rating": 5
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Rating updated", () => pm.expect(pm.response.json().rating).to.eql(5));
