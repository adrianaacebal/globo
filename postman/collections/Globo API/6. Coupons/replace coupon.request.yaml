$kind: http-request
name: 'replace coupon (PUT)'
method: PUT
url: '{{baseUrl}}/coupons/{{couponId}}'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "GLOBO20",
      "percent": 25,
      "active": true,
      "orderType": "delivery"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Percent updated", () => pm.expect(pm.response.json().percent).to.eql(25));
