$kind: http-request
name: 'update coupon (PATCH)'
method: PATCH
url: '{{baseUrl}}/coupons/{{couponId}}'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "active": false
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Active updated", () => pm.expect(pm.response.json().active).to.eql(false));
