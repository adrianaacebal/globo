$kind: http-request
name: create complaint
method: POST
url: '{{baseUrl}}/complaints'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Ana García",
      "email": "ana@example.com",
      "brand": "burgerking",
      "type": "delivery",
      "date": "2026-11-01",
      "message": "My order arrived very late and the food was cold."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      const r = pm.response.json();
      pm.test("Has id", () => pm.expect(r.id).to.be.a("number"));
      pm.collectionVariables.set("complaintId", r.id);
