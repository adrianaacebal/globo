$kind: http-request
name: get complaint by id
method: GET
url: '{{baseUrl}}/complaints/{{complaintId}}'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Same id", () => pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get("complaintId"))));
