$kind: http-request
name: list complaints
method: GET
url: '{{baseUrl}}/complaints'
order: 1000
queryParams:
  - key: search
    value: ''
    disabled: true
  - key: brand
    value: burgerking
    disabled: true
  - key: type
    value: delivery
    disabled: true
  - key: status
    value: open
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response is an array", () => pm.expect(pm.response.json()).to.be.an("array"));
