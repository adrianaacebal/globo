<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> GLOBO - Search for restaurants </title>
    <link rel="stylesheet" href="styles.css">

</head>


<body>
    <!-- Guarda si el menu esta abierto (marcado) o cerrado (sin marcar) -->
    <input type="checkbox" id="menu-toggle" class="menu-toggle" checked>

    <header>
        <img class="logo-img" src="images/image.png" alt="Globo logo">

          <p class="logo">
            <span class="l1">G</span><span class="l2">L</span><span class="l3">O</span><span class="l4">B</span><span class="l5">O</span>
        </p>
        <label class="menu-btn" for="menu-toggle">☰</label>

    </header>

    <div class="layout">
        <nav class="sidebar">
            <p class="sidebar-title">Menu</p>
            <ul>
                <li><a href="index.html"><span class="nav-icon">🏠</span>Home</a></li>
                <li><a href="login.html"><span class="nav-icon">👤</span>Login</a></li>
                <li><a href="order.html"><span class="nav-icon">✉️</span>Order online</a></li>
                <li><a href="search.html"><span class="nav-icon">📍</span>Search for restaurants</a></li>
                <li><a href="complaint.html"><span class="nav-icon">⚠️</span>Report a problem</a></li>
            </ul>
        </nav>

    <main>

     <section>
        <div class="hero-head">
            <h1>Search for restaurants</h1>
            <p>Find the <span>best restaurants</span> near you on the map.</p>
        </div>

        <!-- Mapa de Google Maps buscando restaurantes cerca de la Puerta del Sol (Madrid) -->
        <div class="map-frame">
            <iframe
                src="https://maps.google.com/maps?q=restaurantes&ll=40.4168,-3.7038&z=16&output=embed"
                loading="lazy"
                allowfullscreen
                referrerpolicy="no-referrer-when-downgrade"
                title="Map of restaurants in Madrid">
            </iframe>
        </div>

        <p class="map-link">
            <a href="https://www.google.com/maps/search/restaurantes/@40.4168,-3.7038,15z"
               target="_blank">Open the map in a bigger window</a>
        </p>
     </section>

    </main>
    </div>

</body>
</html>
